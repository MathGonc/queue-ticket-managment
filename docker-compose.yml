services:

  mongodb:
    image: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db


  backend:
    build: .
    ports:
      - "3030:3030"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
    - CHOKIDAR_USEPOLLING=true
    command: npm run dev
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm run serve

volumes:
  mongodb_data: