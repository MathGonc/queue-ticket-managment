# Serve o build do frontend (SPA). O navegador fala direto com o backend
# em <host>:3030, entao nao ha proxy aqui.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rotas do Vue Router caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca em cache (para pegar o build novo apos atualizar);
    # assets tem hash no nome e podem ficar em cache
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
