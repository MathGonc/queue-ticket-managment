# Sobe MongoDB + backend + frontend em containers.
# Uso (na pasta infra/docker):  copie .env.example para .env, ajuste e rode
#   docker compose up -d --build
name: qtm

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS:?defina DB_PASS em infra/docker/.env}
    # So na maquina local (Compass/mongosh). Nao expor o banco na rede.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      DB_IP: mongodb:27017
      DB_NAME: ${DB_NAME:-gonc-queue-manager}
      DB_USER: ${DB_USER:-admin}
      DB_PASS: ${DB_PASS}
      PORT: 3030
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET em infra/docker/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-72h}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Log so no stdout (docker compose logs); sem arquivo dentro do container
      LOG_DIR: ''
      # Logo importado em Configuracoes > Empresa
      DATA_DIR: /data
    volumes:
      - branding_data:/data
    ports:
      - "${BACKEND_PORT:-3030}:3030"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        # O navegador chama o backend em <mesmo host>:<BACKEND_PORT>
        VITE_PORT_SERVER: ${BACKEND_PORT:-3030}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  branding_data:
